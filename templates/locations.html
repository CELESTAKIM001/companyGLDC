{% extends 'base.html' %}{% block content %}<section class='section'><div class='container'><div class='toolbar'><div><span class='eyebrow'>GLDC MAP VIEWER</span><h1>Our Offices & Locations</h1><p class='mutedx'>Explore GLDC office locations on the interactive basemap.</p></div><a class='btn secondary' href='/contact'>CONTACT GLDC</a></div><div class='grid grid-2' style='margin-top:22px'><div class='card' id='officeList'>Loading offices…</div><div class='card'><div id='map' style='height:560px;border-radius:12px'></div></div></div></div></section>{% endblock %}{% block scripts %}<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script>async function init(){const j=await (await fetch('/api/public/locations')).json();const xs=j.locations||[];const map=L.map('map').setView([-1.286389,36.817223],6);const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const terrain=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap'});L.control.layers({'Street / OpenStreetMap':osm,'Terrain':terrain}).addTo(map);officeList.innerHTML=xs.map((x,i)=>`<button class="btn secondary" style="width:100%;text-align:left;margin-bottom:8px" onclick="zoomOffice(${i})"><b>${x.name}</b><br><span class=mutedx>${x.address||''}</span></button>`).join('')||'<div class=notice>No published offices yet.</div>';xs.forEach((x,i)=>{x._marker=L.marker([x.lat,x.lng]).addTo(map).bindPopup('<b>'+x.name+'</b><br>'+ (x.description||'')+'<br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination='+x.lat+','+x.lng+'">Get directions</a>')});if(xs.length){const p=xs.find(x=>x.primary)||xs[0];map.setView([p.lat,p.lng],p.zoom||15)}window.zoomOffice=i=>{const x=xs[i];map.setView([x.lat,x.lng],x.zoom||15);x._marker.openPopup()};setTimeout(()=>map.invalidateSize(),100)}</script><script>init()</script>{% endblock %}
