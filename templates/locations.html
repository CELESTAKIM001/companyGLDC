{% extends 'base.html' %}{% block content %}<section class='section'><div class='container'><span class='eyebrow'>GLDC LOCATIONS</span><h1>Our Offices</h1><p>Select an office to zoom the map and view contact details.</p><div class='grid grid-2' style='margin-top:22px'><div class='card' id='officeList'>Loading offices…</div><div class='card'><div id='map' style='height:500px;border-radius:12px'></div></div></div></div></section>{% endblock %}{% block scripts %}<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'><script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script><script>async function init(){const j=await (await fetch('/api/public/locations')).json();const xs=j.locations||[];const map=L.map('map').setView([0,37.9],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);officeList.innerHTML=xs.map((x,i)=>`<button class="btn secondary" style="width:100%;text-align:left;margin-bottom:8px" onclick="zoomOffice(${i})"><b>${x.name}</b><br><span class=mutedx>${x.address||''}</span></button>`).join('')||'<div class=notice>No published offices yet.</div>';xs.forEach((x,i)=>{x._marker=L.marker([x.lat,x.lng]).addTo(map).bindPopup('<b>'+x.name+'</b><br>'+ (x.description||'')+'<br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination='+x.lat+','+x.lng+'">Get directions</a>')});if(xs.length){const p=xs.find(x=>x.primary)||xs[0];map.setView([p.lat,p.lng],p.zoom||15)}window.zoomOffice=i=>{const x=xs[i];map.setView([x.lat,x.lng],x.zoom||15);x._marker.openPopup()}}</script><script>init()</script>{% endblock %}
