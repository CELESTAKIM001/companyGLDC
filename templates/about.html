{% extends 'base.html' %}{% block content %}
<main class="page cms-rich-page"><section class="hero cms-bg-hero" data-effect="{{ page.heroEffect|default('slide') }}" style="--cms-bg:url('/api/public/site-image/{{ page.heroImages[0] if page.heroImages else '' }}')"><div class="container hero-content"><span class="eyebrow light">{{ page.eyebrow }}</span><h1>{{ page.title }}</h1><p>{{ page.intro }}</p></div></section>
<section class="section"><div class="container grid grid-2">{% for s in page.sections %}<article class="card cms-media-card"><div class="cms-media-strip effect-{{ s.effect|default('hover') }}">{% for code in s.images|default([]) %}<img src="/api/public/site-image/{{ code }}" alt="{{ s.title|e }}" loading="lazy">{% endfor %}</div><span class="eyebrow">{{ s.eyebrow }}</span><h2>{{ s.title }}</h2><p>{{ s.text }}</p></article>{% endfor %}</div></section></main>{% endblock %}
