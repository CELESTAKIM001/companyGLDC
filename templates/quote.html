{% extends 'generic.html' %}{% set eyebrow='PROJECT ENQUIRY' %}{% set heading='Tell GLDC what you need.' %}{% set intro='Submit project information for administrative review. A verification code will be sent to your email.' %}{% block body %}<section class="section"><div class="container"><form id="leadForm" class="form-card"><div class="form-grid"><div class="field"><label>Name *</label><input name="name" required minlength="2"></div><div class="field"><label>Phone *</label><input name="phone" required></div><div class="field"><label>Email *</label><input type="email" name="email" required></div><div class="field"><label>Service *</label><select name="service"><option>Land Development Consultancy</option><option>Architectural Design</option><option>Planning & Approvals</option><option>Project Consultancy</option></select></div><div class="field"><label>County *</label><input name="county" required></div><div class="field"><label>Town / Area *</label><input name="town" required></div><div class="field full"><label>Plot / Location</label><input name="plot"></div><div class="field full"><label>Project description *</label><textarea name="description" required minlength="10"></textarea></div><div class="field"><label>Approximate size</label><input name="size"></div><div class="field"><label>Desired timeline</label><input name="timeline"></div><div class="field"><label>Budget (KES)</label><input name="budget" inputmode="numeric"></div><div class="field full"><label class="check"><input type="checkbox" name="consent" value="yes" required> I accept the privacy/consent requirement.</label></div><div class="field full"><button class="btn primary" id="leadBtn">SUBMIT PROJECT ENQUIRY</button></div></div><div id="leadMsg"></div></form></div></section>{% endblock %}{% block scripts %}<script>document.getElementById('leadForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('leadBtn'),msg=document.getElementById('leadMsg');btn.disabled=true;msg.innerHTML='';const data=Object.fromEntries(new FormData(e.currentTarget));try{const r=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error?.message||'Submission failed');msg.innerHTML=`<div class="notice">Enquiry <strong>${j.id}</strong> received. Please check your email for verification instructions. <a href="/verify?email=${encodeURIComponent(data.email)}">Verify now →</a></div>`;e.currentTarget.reset()}catch(x){msg.innerHTML=`<div class="notice">${x.message}</div>`}finally{btn.disabled=false}})</script>{% endblock %}
