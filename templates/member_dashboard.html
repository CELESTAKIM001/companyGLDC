{% extends 'base.html' %}
{% block content %}
<section class="section"><div class="container">
<div class="toolbar"><div><span class="eyebrow">MEMBER PORTAL</span><h1>My GLDC Portal</h1><p class="mutedx">Membership, certificates, receipts, documents, leads and account security.</p></div><button class="btn secondary" onclick="logout()">LOG OUT</button></div>
<div id="portal"></div>
</div></section>
{% endblock %}
{% block scripts %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const csrf=document.querySelector('meta[name=csrf-token]').content;let state={};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
async function load(){const r=await fetch('/api/member/portal');if(!r.ok){location.href='/member/login';return}state=await r.json();render();}
function statusClass(s){return ['ACTIVE','EXPIRING_SOON'].includes(s)?'badge success':(['EXPIRED','REJECTED'].includes(s)?'badge danger':'badge')}
function render(){const m=state.member||{}, status=m.status||'PENDING';const canRenew=!!m.renewalAvailable;const certs=state.certificates||[];const payments=state.payments||[];const docs=state.documents||[];const leads=state.leads||[];const notes=state.notifications||[];$('portal').innerHTML=`
<div class="card" style="margin-top:22px"><div class="toolbar"><div><span class="eyebrow">MEMBERSHIP STATUS</span><h2>${esc(m.name)}</h2></div><span class="${statusClass(status)}">${esc(status)}</span></div><div class="grid grid-4"><div><small>PLAN</small><h3>${esc(m.membershipPlan||'Not selected')}</h3></div><div><small>MEMBERSHIP NO.</small><h3>${esc(m.membershipNumber||'Pending')}</h3></div><div><small>VALID FROM</small><h3>${esc(String(m.validFrom||'').slice(0,10)||'—')}</h3></div><div><small>VALID UNTIL</small><h3>${esc(String(m.validUntil||'').slice(0,10)||'—')}</h3></div></div>${status==='EXPIRED'?'<div class="notice"><b>Membership Expired</b><br>Your membership has expired. Renew your membership to restore active status and receive a new certificate.</div>':''}${status==='EXPIRING_SOON'?'<div class="notice"><b>Renewal available</b><br>Your membership is approaching expiry. Renew now to continue without interruption.</div>':''}${canRenew?`<div style="margin-top:14px"><button class="btn primary" onclick="showRenewal()">RENEW MEMBERSHIP</button></div>`:''}<div id="renewBox"></div></div>
<div class="grid grid-2" style="margin-top:18px"><div class="card"><span class="eyebrow">CERTIFICATE HISTORY</span><h2>Membership certificates</h2>${certs.length?certs.map((c,i)=>`<div class="panelx"><div class="toolbar"><div><b>${esc(c.certificateNumber)}</b><br><span class="mutedx">${esc(c.planName)} • ${esc(String(c.validFrom||'').slice(0,10))} – ${esc(String(c.validUntil||'').slice(0,10))}</span></div><span class="badge">${esc(c.status||'EXPIRED')}</span></div><small>Issued ${esc(String(c.issuedAt||'').slice(0,10))}</small> <a class="btn small secondary" href="/api/member/certificates/${encodeURIComponent(c.certificateNumber)}/download">DOWNLOAD</a> <a class="btn small" href="/membership/certificate/${encodeURIComponent(c.certificateNumber)}" target="_blank">VERIFY</a></div>`).join(''):'<p class="mutedx">No certificate has been issued yet. A certificate is created only after approval.</p>'}</div>
<div class="card"><span class="eyebrow">PAYMENTS & RECEIPTS</span><h2>Payment history</h2>${payments.length?payments.map(p=>`<div class="panelx"><b>${esc(p.planName||'Membership payment')}</b><br>KES ${Number(p.amount||0).toLocaleString()} • ${esc(p.status)}<br><small>Receipt: ${esc(p.receiptCode||'Pending')} • ${esc(String(p.createdAt||'').slice(0,10))}</small></div>`).join(''):'<p class="mutedx">No membership payments yet.</p>'}</div></div>
<div class="grid grid-2" style="margin-top:18px"><div class="card"><span class="eyebrow">MY PROFILE</span><h2>Profile & location</h2><form id="profileForm"><div class="field"><label>Full name *</label><input name="name" required value="${esc(m.name)}"></div><div class="field"><label>Phone *</label><input name="phone" type="tel" required value="${esc(m.phone)}"></div><div class="field"><label>Profession</label><input name="profession" value="${esc(m.profession)}"></div><div class="field"><label>Company</label><input name="company" value="${esc(m.company)}"></div><div class="field"><label>Location / town</label><input name="location" value="${esc(m.location)}"></div><div class="field"><label>Latitude / longitude (optional)</label><div class="grid grid-2"><input name="locationLat" type="number" step="any" value="${m.locationLat??''}" placeholder="Latitude"><input name="locationLng" type="number" step="any" value="${m.locationLng??''}" placeholder="Longitude"></div></div><div class="field"><label>Biography</label><textarea name="bio">${esc(m.bio)}</textarea></div><div class="field"><label>Portfolio URL</label><input name="portfolioUrl" type="url" value="${esc(m.portfolioUrl)}"></div><button class="btn primary">SAVE PROFILE</button></form><div id="profileMsg"></div></div><div class="card"><span class="eyebrow">MAP VIEWER</span><h2>My location</h2><p class="mutedx">Use the map to view the saved location. Exact coordinates are optional and are not required for membership.</p><div id="memberMap" style="height:390px;border-radius:12px"></div></div></div>
<div class="grid grid-2" style="margin-top:18px"><div class="card"><span class="eyebrow">MY LEADS</span><h2>Create & manage leads</h2><form id="leadForm"><div class="field"><label>Prospect name *</label><input name="name" required></div><div class="field"><label>Phone *</label><input name="phone" type="tel" required></div><div class="field"><label>Email *</label><input name="email" type="email" required></div><div class="field"><label>Service *</label><select name="service" required><option value="">Select service…</option><option>Land Development Consultancy</option><option>Architectural Design</option><option>Planning & Approvals</option><option>Project Consultancy</option><option>Surveying & GIS</option></select></div><div class="field"><label>County *</label><input name="county" required></div><div class="field"><label>Town / Area *</label><input name="town" required></div><div class="field"><label>Description *</label><textarea name="description" required minlength="10"></textarea></div><button class="btn primary">CREATE LEAD</button></form><div id="leadMsg"></div><hr>${leads.length?leads.map(l=>`<div class="panelx"><b>${esc(l.name)}</b> • ${esc(l.status)}<br><small>${esc(l.service)} • ${esc(l.town||'')}</small></div>`).join(''):'<p class="mutedx">No leads created yet.</p>'}</div><div class="card"><span class="eyebrow">DOCUMENTS & NOTIFICATIONS</span><h2>Supporting documents</h2><form id="docForm"><div class="field"><label>Document *</label><input id="docFile" type="file" required></div><div class="field"><label>Document type *</label><select id="docCat" required><option value="">Select type…</option><option>CV</option><option>PORTFOLIO</option><option>PASSPORT PHOTO</option><option>ID PDF</option><option>SUPPORTING DOCUMENT</option></select></div><button class="btn secondary">UPLOAD DOCUMENT</button></form><div id="docMsg"></div>${docs.map(d=>`<div class="panelx"><b>${esc(d.category)}</b> — ${esc(d.name)}</div>`).join('')}<hr><h3>Notifications</h3>${notes.map(n=>`<div class="panelx"><b>${esc(n.type||'Update')}</b><br>${esc(n.message)}</div>`).join('')||'<p class="mutedx">No new notifications.</p>'}</div></div>
<div class="card" style="margin-top:18px"><span class="eyebrow">ACCOUNT & SECURITY</span><h2>Secure member access</h2><p>You sign in using email verification codes. No member password is stored in the portal.</p><a class="btn secondary" href="/member/login">SIGN IN AGAIN</a></div>`;
profileForm.onsubmit=saveProfile;leadForm.onsubmit=createLead;docForm.onsubmit=uploadDoc;drawMap(m);
}
function drawMap(m){if(!window.L)return;const el=$('memberMap');if(!el)return;const lat=Number(m.locationLat),lng=Number(m.locationLng);const map=L.map(el).setView(Number.isFinite(lat)&&Number.isFinite(lng)?[lat,lng]:[-1.286389,36.817223],Number.isFinite(lat)&&Number.isFinite(lng)?13:6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);if(Number.isFinite(lat)&&Number.isFinite(lng))L.marker([lat,lng]).addTo(map).bindPopup('<b>Saved member location</b>').openPopup();setTimeout(()=>map.invalidateSize(),100)}
function showRenewal(){const ps=state.plans||[];$('renewBox').innerHTML=`<div class="panelx" style="margin-top:16px"><b>Choose renewal plan</b><div class="grid grid-2" style="margin-top:10px">${ps.map(p=>`<label><input type="radio" name="renewPlan" value="${esc(p.id)}"> ${esc(p.name)} — KES ${Number(p.price).toLocaleString()} (${esc(p.months)} months)</label>`).join('')}</div><button class="btn primary" style="margin-top:12px" onclick="renew()">PAY & RENEW</button><div id="renewMsg"></div></div>`}
async function renew(){const p=document.querySelector('input[name=renewPlan]:checked');if(!p){$('renewMsg').innerHTML='<div class="notice">Select a renewal plan.</div>';return}try{const r=await fetch('/api/membership/subscribe',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({planId:p.value})});const j=await r.json();if(!r.ok)throw Error(j.error?.message||'Unable to start renewal.');$('renewMsg').innerHTML='<div class="notice">'+esc(j.message||'Payment prompt sent. Approve it on your phone. Your renewal will enter review after verified payment.')+'</div>';setTimeout(load,4000)}catch(e){$('renewMsg').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
async function saveProfile(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));['locationLat','locationLng'].forEach(k=>{if(data[k]==='')delete data[k]});const r=await fetch('/api/membership/profile',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});const j=await r.json();$('profileMsg').innerHTML='<div class="notice">'+esc(j.ok?'Profile saved.':j.error?.message||'Unable to save profile.')+'</div>';if(j.ok)load()}
async function createLead(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));data.consent='yes';const r=await fetch('/api/member/leads',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});const j=await r.json();$('leadMsg').innerHTML='<div class="notice">'+esc(j.ok?'Lead '+j.id+' created successfully.':j.error?.message||'Unable to create lead.')+'</div>';if(j.ok){e.currentTarget.reset();load()}}
async function uploadDoc(e){e.preventDefault();const f=$('docFile').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);fd.append('category',$('docCat').value);const r=await fetch('/api/membership/documents',{method:'POST',headers:{'X-CSRF-Token':csrf},body:fd});const j=await r.json();$('docMsg').innerHTML='<div class="notice">'+esc(j.ok?'Document uploaded securely.':j.error?.message||'Upload failed.')+'</div>';if(j.ok)load()}
async function logout(){await fetch('/api/auth/logout',{method:'POST',headers:{'X-CSRF-Token':csrf}});location.href='/member/login'}load();
</script>{% endblock %}
