{% extends 'base.html' %}
{% block content %}
<section class="section"><div class="container">
<div class="toolbar"><div><span class="eyebrow">MEMBER PORTAL</span><h1>My GLDC Portal</h1><p class="mutedx">Manage your membership, profile, documents and professional leads.</p></div><button class="btn secondary" onclick="logout()">LOG OUT</button></div>
<div id="portal" class="grid grid-2" style="margin-top:24px"></div>
</div></section>
{% endblock %}
{% block scripts %}<script>
const csrf=document.querySelector('meta[name=csrf-token]').content;let state={};
function esc(v){return String(v??'').replace(/[&<>\"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[x]))}
async function load(){const r=await fetch('/api/member/portal');if(!r.ok){location.href='/member/login';return}state=await r.json();render();}
function render(){const m=state.member||{},payments=state.payments||[],docs=state.documents||[],leads=state.leads||[],notes=state.notifications||[];document.getElementById('portal').innerHTML=`
<div class="card"><span class="eyebrow">DASHBOARD</span><h2>Welcome, ${esc(m.name)}</h2><div class="grid grid-2"><div><small>Membership status</small><h3>${esc(m.status)}</h3></div><div><small>Membership plan</small><h3>${esc(m.membershipPlan||'Pending selection')}</h3></div><div><small>Membership number</small><h3>${esc(m.membershipNumber||'Pending')}</h3></div><div><small>Valid until</small><h3>${esc(m.validUntil||'Pending approval')}</h3></div></div></div>
<div class="card"><span class="eyebrow">MY PROFILE</span><form id="profileForm"><div class="field"><label>Full name *</label><input name="name" required value="${esc(m.name)}"></div><div class="field"><label>Phone *</label><input name="phone" type="tel" required value="${esc(m.phone)}"></div><div class="field"><label>Profession</label><input name="profession" value="${esc(m.profession)}"></div><div class="field"><label>Company</label><input name="company" value="${esc(m.company)}"></div><div class="field"><label>Location</label><input name="location" value="${esc(m.location)}"></div><div class="field"><label>Biography</label><textarea name="bio">${esc(m.bio)}</textarea></div><div class="field"><label>Portfolio URL</label><input name="portfolioUrl" type="url" value="${esc(m.portfolioUrl)}"></div><button class="btn primary">SAVE PROFILE</button></form><div id="profileMsg"></div><p style="margin-top:12px"><a href="${m.profileSlug?'/members/'+encodeURIComponent(m.profileSlug):'#'}">View my public profile →</a></p></div>
<div class="card"><span class="eyebrow">CREATE A LEAD</span><h2>Submit a professional lead</h2><p>Only authenticated GLDC members can create CRM leads. The lead is attributed to your membership account.</p><form id="leadForm"><div class="field"><label>Prospect name *</label><input name="name" required></div><div class="field"><label>Phone *</label><input name="phone" type="tel" required></div><div class="field"><label>Email *</label><input name="email" type="email" required></div><div class="field"><label>Service *</label><select name="service" required><option value="">Select service</option><option>Land Development Consultancy</option><option>Architectural Design</option><option>Planning & Approvals</option><option>Project Consultancy</option><option>Surveying & GIS</option></select></div><div class="field"><label>County *</label><input name="county" required></div><div class="field"><label>Town / Area *</label><input name="town" required></div><div class="field"><label>Description *</label><textarea name="description" required minlength="10"></textarea></div><button class="btn primary">CREATE LEAD</button></form><div id="leadMsg"></div></div>
<div class="card"><span class="eyebrow">PAYMENTS & RECEIPTS</span><h2>Payment history</h2>${payments.length?payments.map(p=>`<div class="panelx"><b>${esc(p.planName||p.source||'Payment')}</b><br>KES ${Number(p.amount||0).toLocaleString()} · ${esc(p.status)}<br><small>Receipt: ${esc(p.receiptCode||'Pending')}</small></div>`).join(''):'<p class="mutedx">No payments recorded yet.</p>'}<hr><h3>Membership plan</h3><select id="plan" required><option value="">Select plan</option>${(state.plans||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.name)} — KES ${Number(p.price||0).toLocaleString()}</option>`).join('')}</select><button class="btn primary" style="margin-top:10px" onclick="subscribe()">PAY MEMBERSHIP</button><div id="payMsg"></div></div>
<div class="card"><span class="eyebrow">CERTIFICATE & DOCUMENTS</span><h2>My documents</h2>${m.certificateNumber?`<p>Certificate: <b>${esc(m.certificateNumber)}</b></p><p>Your approved membership certificate is archived with GLDC. A copy was sent to your registered email.</p>`:'<p class="mutedx">Certificate becomes available after membership approval.</p>'}<hr><form id="docForm"><div class="field"><label>Document *</label><input id="docFile" type="file" required></div><div class="field"><label>Document type *</label><select id="docCat" required><option value="">Select type</option><option>CV</option><option>PORTFOLIO</option><option>PASSPORT PHOTO</option><option>ID PDF</option><option>SUPPORTING DOCUMENT</option></select></div><button class="btn secondary">UPLOAD DOCUMENT</button></form><div id="docMsg"></div>${docs.length?'<hr>'+docs.map(d=>`<p><b>${esc(d.category)}</b> — ${esc(d.name)} <small>(${esc(d.mimeType||'file')})</small></p>`).join(''):''}</div>
<div class="card"><span class="eyebrow">MY LEADS</span><h2>Lead history</h2>${leads.length?leads.map(l=>`<div class="panelx"><b>${esc(l.name)}</b> · ${esc(l.status)}<br><small>${esc(l.service)} · ${esc(l.town||'')}</small></div>`).join(''):'<p class="mutedx">You have not created any leads yet.</p>'}</div>
<div class="card"><span class="eyebrow">NOTIFICATIONS</span><h2>Updates</h2>${notes.length?notes.map(n=>`<div class="panelx"><b>${esc(n.type||'Update')}</b><br>${esc(n.message)}</div>`).join(''):'<p class="mutedx">No new notifications.</p>'}</div>
<div class="card"><span class="eyebrow">ACCOUNT & SECURITY</span><h2>Secure account</h2><p>Your portal uses email verification codes instead of storing a member password. To sign in again, request a new code using your registered email.</p><a class="btn secondary" href="/member/login">SIGN-IN SECURITY</a></div>`;
profileForm.onsubmit=saveProfile;leadForm.onsubmit=createLead;docForm.onsubmit=uploadDoc;}
async function saveProfile(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('/api/membership/profile',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});const j=await r.json();profileMsg.innerHTML='<div class="notice">'+(j.ok?'Profile saved.':j.error?.message||'Unable to save profile.')+'</div>';if(j.ok)load();}
async function createLead(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));data.consent='yes';const r=await fetch('/api/member/leads',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});const j=await r.json();leadMsg.innerHTML='<div class="notice">'+(j.ok?'Lead '+j.id+' created successfully.':j.error?.message||'Unable to create lead.')+'</div>';if(j.ok)e.currentTarget.reset();if(j.ok)load();}
async function uploadDoc(e){e.preventDefault();const f=document.getElementById('docFile').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);fd.append('category',document.getElementById('docCat').value);const r=await fetch('/api/membership/documents',{method:'POST',headers:{'X-CSRF-Token':csrf},body:fd});const j=await r.json();docMsg.innerHTML='<div class="notice">'+(j.ok?'Document uploaded securely.':j.error?.message||'Upload failed.')+'</div>';if(j.ok)load();}
async function subscribe(){const plan=document.getElementById('plan').value;if(!plan)return;const r=await fetch('/api/membership/subscribe',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({planId:plan})});const j=await r.json();payMsg.innerHTML='<div class="notice">'+(j.message||j.error?.message||'Unable to start payment.')+'</div>';}
async function logout(){await fetch('/api/auth/logout',{method:'POST',headers:{'X-CSRF-Token':csrf}});location.href='/member/login'}load();
</script>{% endblock %}
