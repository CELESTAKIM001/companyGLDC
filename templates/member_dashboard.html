{% extends 'base.html' %}
{% block content %}
<section class="section"><div class="container">
<div class="toolbar"><div><span class="eyebrow">GLDC MEMBER PORTAL</span><h1>Welcome to your dashboard</h1><p class="mutedx">Continue applications, complete payments, change your membership plan and manage your GLDC account.</p></div><button class="btn secondary" onclick="logout()">LOG OUT</button></div>
<div id="portal"></div>
</div></section>
{% endblock %}
{% block scripts %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const csrf=document.querySelector('meta[name=csrf-token]').content;let state={};const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
async function json(r){const t=await r.text();try{return t?JSON.parse(t):{}}catch(e){return {ok:false,error:{message:t||('Request failed ('+r.status+')')}}}}
async function load(){try{const r=await fetch('/api/member/portal',{headers:{'Accept':'application/json'}});if(!r.ok){location.href='/member/login';return}state=await r.json();render()}catch(e){$('portal').innerHTML='<div class="notice">We could not load your portal right now. Please refresh and try again.</div>'}}
function badge(s){return ['ACTIVE','EXPIRING_SOON'].includes(s)?'badge success':(['EXPIRED','REJECTED'].includes(s)?'badge danger':'badge')}
function date(v){return v?String(v).slice(0,10):'—'}
function render(){const m=state.member||{},status=m.status||'PENDING',payments=state.payments||[],certs=state.certificates||[],docs=state.documents||[],leads=state.leads||[],notes=state.notifications||[],plans=state.plans||[];const pendingPay=payments.find(p=>['PENDING','PAYMENT_PENDING'].includes(String(p.status).toUpperCase()));const canResume=['PENDING_PAYMENT','PAYMENT_FAILED','PAYMENT_PENDING','EMAIL_PENDING'].includes(status);const canChange=!!m.emailVerified&&['ACTIVE','EXPIRING_SOON','EXPIRED','PENDING_PAYMENT','PAYMENT_FAILED','PAYMENT_PENDING','RENEWAL_PENDING'].includes(status);
$('portal').innerHTML=`
<div class="grid grid-4" style="margin-top:22px">
<div class="card"><small>MEMBERSHIP STATUS</small><h2><span class="${badge(status)}">${esc(status.replaceAll('_',' '))}</span></h2><p class="mutedx">${status==='EXPIRED'?'Your membership has expired. Renew to restore active status.':status==='PENDING_REVIEW'?'Payment received. GLDC is reviewing your application.':'Your current membership state.'}</p></div>
<div class="card"><small>CURRENT PLAN</small><h2>${esc(m.membershipPlan||'Not selected')}</h2><p class="mutedx">Membership No: ${esc(m.membershipNumber||'Pending')}</p></div>
<div class="card"><small>VALID UNTIL</small><h2>${esc(date(m.validUntil))}</h2><p class="mutedx">Valid from ${esc(date(m.validFrom))}</p></div>
<div class="card"><small>ACCOUNT</small><h2>${esc(m.name||'Member')}</h2><p class="mutedx">${esc(m.email||'')}</p></div>
</div>
${canResume?`<div class="card" style="margin-top:18px;border:1px solid rgba(139,74,24,.25)"><div class="toolbar"><div><span class="eyebrow">CONTINUE WHERE YOU LEFT OFF</span><h2>${status==='PAYMENT_FAILED'?'Payment needs attention':'Your membership application is not finished'}</h2><p class="mutedx">You do not need to start again. Review your details, choose a plan and complete payment from here.</p></div><button class="btn primary" onclick="resumeApplication()">${status==='PAYMENT_FAILED'?'TRY PAYMENT AGAIN':'CONTINUE APPLICATION'}</button></div>${pendingPay?`<div class="panelx" style="margin-top:12px"><b>Pending payment:</b> ${esc(pendingPay.planName||'Membership')} — KES ${Number(pendingPay.amount||0).toLocaleString()} · ${esc(pendingPay.receiptCode||'')}</div>`:''}<div id="resumeMsg"></div></div>`:''}
${status==='PENDING_REVIEW'?'<div class="notice" style="margin-top:18px"><b>Payment received ✓</b><br>Your application is now under GLDC review. You will receive an update when a decision is made.</div>':''}
${status==='EXPIRED'?'<div class="notice" style="margin-top:18px"><b>Membership expired</b><br>Choose a renewal plan below. Your old certificate remains in your certificate history.</div>':''}
${canChange?`<div class="card" style="margin-top:18px"><div class="toolbar"><div><span class="eyebrow">EDIT MEMBERSHIP</span><h2>Change or upgrade your tier</h2><p class="mutedx">Select another plan. Your current membership is not changed until the new payment is successful and GLDC approves the change.</p></div><button class="btn primary" onclick="showPlanEditor()">EDIT / UPGRADE PLAN</button></div><div id="planEditor"></div></div>`:''}
<div class="grid grid-2" style="margin-top:18px"><div class="card"><span class="eyebrow">CERTIFICATE HISTORY</span><h2>Your certificates</h2>${certs.length?certs.map(c=>`<div class="panelx"><div class="toolbar"><div><b>${esc(c.certificateNumber)}</b><br><span class="mutedx">${esc(c.planName)} · ${esc(date(c.validFrom))} – ${esc(date(c.validUntil))}</span></div><span class="${badge(c.status||'EXPIRED')}">${esc(c.status||'EXPIRED')}</span></div><small>Issued ${esc(date(c.issuedAt))}</small><br><a class="btn small secondary" href="/api/member/certificates/${encodeURIComponent(c.certificateNumber)}/download">DOWNLOAD</a> <a class="btn small" href="/membership/certificate/${encodeURIComponent(c.certificateNumber)}" target="_blank">VERIFY</a></div>`).join(''):'<p class="mutedx">No certificate has been issued yet.</p>'}</div>
<div class="card"><span class="eyebrow">PAYMENT HISTORY</span><h2>Payments & receipts</h2>${payments.length?payments.map(p=>`<div class="panelx"><b>${esc(p.planName||'Membership')}</b><br>KES ${Number(p.amount||0).toLocaleString()} · <span class="${badge(p.status)}">${esc(p.status)}</span><br><small>Receipt: ${esc(p.receiptCode||'Pending')} · ${esc(date(p.createdAt))}</small></div>`).join(''):'<p class="mutedx">No membership payments yet.</p>'}</div></div>
<div class="grid grid-2" style="margin-top:18px"><div class="card"><span class="eyebrow">MY PROFILE</span><h2>Edit your details</h2><form id="profileForm"><div class="field"><label>Full name *</label><input name="name" required value="${esc(m.name)}"></div><div class="field"><label>Phone *</label><input name="phone" type="tel" inputmode="tel" placeholder="0712 345 678 or +254 712 345 678" pattern="(?:0|\\+?254)7\\d{8}" required value="${esc(m.phone)}"></div><div class="field"><label>Profession</label><input name="profession" value="${esc(m.profession)}"></div><div class="field"><label>Company</label><input name="company" value="${esc(m.company)}"></div><div class="field"><label>Location / town</label><input name="location" value="${esc(m.location)}"></div><div class="field"><label>Biography</label><textarea name="bio">${esc(m.bio)}</textarea></div><div class="field"><label>Portfolio URL</label><input name="portfolioUrl" type="url" value="${esc(m.portfolioUrl)}"></div><button class="btn primary">SAVE CHANGES</button></form><div id="profileMsg"></div></div>
<div class="card"><span class="eyebrow">MAP VIEWER</span><h2>My saved location</h2><p class="mutedx">Your location can be viewed on the map. You can update your location from your profile.</p><div id="memberMap" style="height:360px;border-radius:12px"></div></div></div>
<div class="grid grid-2" style="margin-top:18px"><div class="card"><span class="eyebrow">MY LEADS</span><h2>Leads I created</h2>${leads.length?leads.map(l=>`<div class="panelx"><b>${esc(l.name)}</b> · ${esc(l.status)}<br><small>${esc(l.service||'')} · ${esc(l.town||'')}</small></div>`).join(''):'<p class="mutedx">No leads created yet.</p>'}<a class="btn secondary" href="/quote" style="margin-top:10px">CREATE / MANAGE LEADS</a></div>
<div class="card"><span class="eyebrow">DOCUMENTS & NOTIFICATIONS</span><h2>My account records</h2>${docs.map(d=>`<div class="panelx"><b>${esc(d.category)}</b> — ${esc(d.name)}</div>`).join('')||'<p class="mutedx">No supporting documents uploaded.</p>'}<hr><h3>Notifications</h3>${notes.map(n=>`<div class="panelx"><b>${esc(n.type||'Update')}</b><br>${esc(n.message)}</div>`).join('')||'<p class="mutedx">No new notifications.</p>'}</div></div>
<div class="card" style="margin-top:18px"><span class="eyebrow">SECURITY</span><h2>Member sign-in</h2><p class="mutedx">GLDC uses email verification codes. You can sign in again without a password.</p><a class="btn secondary" href="/member/login">MEMBER LOGIN</a></div>`;
const pf=$('profileForm');if(pf)pf.onsubmit=saveProfile;drawMap(m)}
function showPlanEditor(){const ps=state.plans||[];$('planEditor').innerHTML=`<div class="panelx" style="margin-top:14px"><label for="changePlan"><b>Select membership tier</b></label><select id="changePlan" required><option value="">Select a plan…</option>${ps.map(p=>`<option value="${esc(p.id)}" ${p.id===state.member.membershipPlanId?'selected':''}>${esc(p.name)} — KES ${Number(p.price).toLocaleString()} · ${esc(p.months)} months</option>`).join('')}</select><p class="mutedx" style="margin-top:8px">After payment, the request goes to GLDC review. Your existing membership remains protected until approval.</p><button class="btn primary" style="margin-top:10px" onclick="changePlan()">PROCEED TO PAYMENT</button><div id="planMsg"></div></div>`}
async function changePlan(){const p=$('changePlan')?.value;if(!p){$('planMsg').innerHTML='<div class="notice">Please select a membership tier.</div>';return}if(!confirm('Proceed with the selected membership plan? Your current membership will not be changed until payment and GLDC approval.'))return;try{const r=await fetch('/api/membership/change-plan',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({planId:p})});const j=await json(r);if(!r.ok)throw Error(j.error?.message||'We could not start the plan-change payment.');$('planMsg').innerHTML='<div class="notice">'+esc(j.message||'Payment prompt sent. Approve it on your phone.')+'</div>';setTimeout(load,5000)}catch(e){$('planMsg').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
async function resumeApplication(){try{const email=state.member?.email||'';const memberId=state.member?.id||state.member?.memberId||'';const token=localStorage.getItem('gldc_resume_token')||'';if(email&&memberId&&token){const r=await fetch('/api/membership/resume',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({email,memberId,resumeToken:token})});const j=await json(r);if(!r.ok)throw Error(j.error?.message||'Unable to resume.')}location.href='/member'}catch(e){$('resumeMsg').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
function drawMap(m){if(!window.L)return;const el=$('memberMap');if(!el)return;const lat=Number(m.locationLat),lng=Number(m.locationLng);const map=L.map(el).setView(Number.isFinite(lat)&&Number.isFinite(lng)?[lat,lng]:[-1.286389,36.817223],Number.isFinite(lat)&&Number.isFinite(lng)?13:6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);if(Number.isFinite(lat)&&Number.isFinite(lng))L.marker([lat,lng]).addTo(map).bindPopup('<b>Saved member location</b>').openPopup();setTimeout(()=>map.invalidateSize(),100)}
async function saveProfile(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('/api/membership/profile',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});const j=await json(r);$('profileMsg').innerHTML='<div class="notice">'+esc(j.ok?'Profile saved successfully.':j.error?.message||'Unable to save profile.')+'</div>';if(j.ok)load()}
async function logout(){await fetch('/api/auth/logout',{method:'POST',headers:{'X-CSRF-Token':csrf}});localStorage.removeItem('gldc_resume_token');location.href='/member/login'}
load();
</script>{% endblock %}
