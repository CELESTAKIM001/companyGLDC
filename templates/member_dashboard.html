{% extends 'base.html' %}{% block content %}<section class='section'><div class='container'><div class='toolbar'><div><span class='eyebrow'>MEMBER DASHBOARD</span><h1>My GLDC Membership</h1></div><a class='btn secondary' href='/api/auth/logout'>Sign out</a></div><div id='dash' class='grid grid-2'></div></div></section>{% endblock %}{% block scripts %}<script>async function load(){const r=await fetch('/api/members/me');const j=await r.json();if(!r.ok){location.href='/membership';return}const m=j.member;const plans=await (await fetch('/api/membership/plans')).json();document.getElementById('dash').innerHTML=`<div class=card><span class=eyebrow>PROFILE</span><div style="display:flex;gap:18px;align-items:center"><img src="${m.photoDriveId?'/api/members/photo/'+m.id:'/static/assets/avatar.svg'}" onerror="this.src='/static/assets/avatar.svg';this.onerror=null" style="width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #eee"><div style="display:none;width:96px;height:96px;border-radius:50%;align-items:center;justify-content:center;background:#8B4A18;color:#fff;font-size:30px;font-weight:800">${(m.name||'?').slice(0,1).toUpperCase()}</div><div><h2>${m.name}</h2><p>${m.profession||'GLDC Member'}</p><p class=mutedx>${m.email}<br>${m.phone||''}</p></div></div><hr><p>Status: <b>${m.status}</b></p><p>Plan: ${m.membershipPlan||'Not selected'}</p><p>Valid: ${m.validUntil||'Pending approval'}</p><p><a href="${m.profileSlug?'/members/'+m.profileSlug:'#'}">Public profile</a></p></div><div class=card><span class=eyebrow>MEMBERSHIP PAYMENT</span><h2>Subscribe</h2><p>Choose a plan after email verification. Successful payment sends an email receipt and starts admin review.</p><select id=plan class=field style="padding:10px;width:100%"><option value="">Select plan</option>${(plans.plans||[]).map(p=>`<option value="${p.id}">${p.name} — KES ${Number(p.price).toLocaleString()}</option>`).join('')}</select><button class="btn primary" style="margin-top:12px" onclick=pay()>PAY MEMBERSHIP</button><div id=msg></div><hr><h3>Supporting documents</h3><p class=mutedx>Optional: CV, portfolio PDF/link, ID PDF or passport photo.</p><input id=file type=file><select id=cat style="padding:10px;width:100%;margin-top:8px"><option>PASSPORT PHOTO</option><option>CV</option><option>ID PDF</option><option>PORTFOLIO</option><option>SUPPORTING DOCUMENT</option></select><button class="btn secondary" style="margin-top:8px" onclick=uploadDoc()>UPLOAD TO DRIVE</button><div id=uploadMsg></div></div>`}async function pay(){const p=document.getElementById('plan').value;if(!p)return;const r=await fetch('/api/membership/subscribe',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':document.querySelector('meta[name=csrf-token]').content},body:JSON.stringify({planId:p})});const j=await r.json();document.getElementById('msg').innerHTML='<div class=notice>'+ (j.message||j.error?.message||'')+'</div>'}async function uploadDoc(){const f=document.getElementById('file').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);fd.append('category',document.getElementById('cat').value);const r=await fetch('/api/membership/documents',{method:'POST',headers:{'X-CSRF-Token':document.querySelector('meta[name=csrf-token]').content},body:fd});const j=await r.json();document.getElementById('uploadMsg').innerHTML='<div class=notice>'+ (j.ok?'Uploaded securely.':j.error?.message||'Upload failed.')+'</div>'}load()</script>{% endblock %}
