{% extends 'base.html' %}
{% block content %}
<section class="section member-shell"><div class="container">
<div class="member-topbar">
  <div>
    <span class="eyebrow">GLDC MEMBER PORTAL</span>
    <h1 id="welcomeTitle">Your membership workspace</h1>
    <p class="mutedx" id="welcomeText">Manage your application, membership, payments and documents from one secure place.</p>
  </div>
  <div class="member-actions">
    <a class="btn secondary" href="/members">SEE OTHER MEMBERS</a>
    <button class="btn" onclick="logout()">LOG OUT</button>
  </div>
</div>
<div id="portal"></div>
</div></section>
{% endblock %}
{% block scripts %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
.member-shell{background:#fbfaf8}.member-topbar{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;margin-bottom:26px}.member-topbar h1{max-width:850px}.member-actions{display:flex;gap:10px;flex-wrap:wrap}.member-hero{display:grid;grid-template-columns:1.5fr .8fr;gap:18px}.member-card{background:#fff;border:1px solid #e8dfd5;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(40,25,15,.05)}.member-card h2{margin:7px 0 10px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid #e8dfd5;border-radius:16px;padding:20px;min-height:150px}.stat .value{font-size:25px;font-weight:800;line-height:1.15;margin-top:8px}.stat .small{margin-top:10px;color:#777}.status-pill{display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.05em}.status-ok{background:#e9f7ef;color:#176b3a}.status-warn{background:#fff4df;color:#87500d}.status-bad{background:#fde9e7;color:#9c2f25}.status-neutral{background:#f0eee9;color:#625d55}.progress-track{height:8px;background:#eee8e1;border-radius:99px;overflow:hidden}.progress-fill{height:100%;background:#a85d1c;border-radius:99px}.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:18px}.step{font-size:11px;color:#8a847d}.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid #ddd3c8;background:#fff;font-weight:800;margin-bottom:7px}.step.done .dot{background:#a85d1c;color:#fff;border-color:#a85d1c}.step.current .dot{border:2px solid #a85d1c;color:#a85d1c}.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.profile-row{padding:13px 0;border-bottom:1px solid #eee7df}.profile-row label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8a8177;margin-bottom:4px}.profile-row strong{font-size:15px}.edit-panel{margin-top:18px;padding-top:18px;border-top:1px solid #eee7df}.hidden{display:none}.panelx{background:#faf8f5;border:1px solid #ece4db;border-radius:12px;padding:14px;margin-top:10px}.record{padding:14px 0;border-bottom:1px solid #eee7df}.record:last-child{border-bottom:0}.record-actions{margin-top:8px}.member-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}.plan-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.plan-option{border:1px solid #ddd3c8;border-radius:13px;padding:14px;background:#fff;cursor:pointer}.plan-option.selected{border:2px solid #a85d1c;background:#fffaf5}.plan-option input{margin-right:7px}.directory-cta{display:flex;justify-content:space-between;align-items:center;gap:20px}.mutedx{color:#706a63}@media(max-width:900px){.member-topbar,.directory-cta{display:block}.member-actions{margin-top:15px}.member-hero,.member-grid,.profile-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.timeline{grid-template-columns:repeat(3,1fr)}.plan-options{grid-template-columns:1fr}}
</style>
<script>
const csrf=document.querySelector('meta[name=csrf-token]').content;let state={};const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
async function json(r){const t=await r.text();try{return t?JSON.parse(t):{}}catch(e){return {ok:false,error:{message:t||('Request failed ('+r.status+')')}}}}
function date(v){return v?String(v).slice(0,10):'—'}
function badge(s){s=String(s||'PENDING').toUpperCase();let c=['ACTIVE','EXPIRING_SOON'].includes(s)?'status-ok':(['EXPIRED','REJECTED'].includes(s)?'status-bad':(['PENDING_REVIEW','PAYMENT_PENDING','PAYMENT_FAILED','CHANGES_REQUIRED','RENEWAL_PENDING'].includes(s)?'status-warn':'status-neutral'));return `<span class="status-pill ${c}">${esc(s.replaceAll('_',' '))}</span>`}
function stage(status){const s=String(status||'EMAIL_PENDING').toUpperCase();if(s==='EMAIL_PENDING')return 2;if(['PENDING_PAYMENT','PAYMENT_FAILED','PAYMENT_PENDING'].includes(s))return 4;if(s==='PENDING_REVIEW'||s==='RENEWAL_PENDING')return 5;if(['ACTIVE','EXPIRING_SOON'].includes(s))return 6;if(s==='EXPIRED')return 6;return 1}
function applicationTimeline(status){let n=stage(status),names=['Create account','Verify email','Choose plan','Pay','GLDC review','Approved'];return `<div class="timeline">${names.map((x,i)=>{let k=i+1;return `<div class="step ${k<n?'done':''} ${k===n?'current':''}"><div class="dot">${k<n?'✓':k}</div>${x}</div>`}).join('')}</div>`}
function render(){const m=state.member||{},status=String(m.status||'PENDING').toUpperCase(),payments=state.payments||[],certs=state.certificates||[],docs=state.documents||[],leads=state.leads||[],notes=state.notifications||[],plans=state.plans||[];const approved=['ACTIVE','EXPIRING_SOON','EXPIRED'].includes(status);const pendingPay=payments.find(p=>['PENDING','PAYMENT_PENDING'].includes(String(p.status).toUpperCase()));const canResume=['EMAIL_PENDING','PENDING_PAYMENT','PAYMENT_FAILED','PAYMENT_PENDING','CHANGES_REQUIRED'].includes(status);const canChange=m.emailVerified&&['ACTIVE','EXPIRING_SOON','EXPIRED','PENDING_PAYMENT','PAYMENT_FAILED','PAYMENT_PENDING','RENEWAL_PENDING'].includes(status);
$('welcomeTitle').textContent=approved?`Welcome back, ${m.name||'Member'}`:'Complete your GLDC membership application';$('welcomeText').textContent=approved?'Your membership, certificates, payments and profile are all in one secure workspace.':'Your email identifies your application, but you are not an approved GLDC member yet. Complete payment and GLDC review to receive membership status and a certificate.';
let hero=approved?`<div class="member-hero"><div class="member-card"><span class="eyebrow">MEMBERSHIP AT A GLANCE</span><h2>${esc(m.membershipPlan||'Membership')}</h2><p>${badge(status)} &nbsp; ${esc(m.membershipNumber||'')}</p><p class="mutedx" style="margin-top:12px">Valid ${esc(date(m.validFrom))} to ${esc(date(m.validUntil))}. Your membership number and certificate are issued only after approval.</p><div class="member-actions" style="margin-top:18px"><a class="btn primary" href="/members">SEE OTHER MEMBERS</a>${canChange?'<button class="btn secondary" onclick="showPlanEditor()">EDIT / UPGRADE TIER</button>':''}</div></div><div class="member-card"><span class="eyebrow">MEMBER PROFILE</span><h2>${esc(m.name||'Member')}</h2><p>${esc(m.profession||'GLDC Member')}</p><p class="mutedx">${esc(m.company||'')} ${m.location?'· '+esc(m.location):''}</p><button class="btn secondary" style="margin-top:14px" onclick="toggleEdit()">EDIT PROFILE</button></div></div>`:`<div class="member-card"><span class="eyebrow">APPLICATION WORKSPACE</span><h2>${esc(m.name||'Your application')}</h2><p>${badge(status)}</p><p class="mutedx" style="margin-top:10px">Email verified: ${m.emailVerified?'Yes ✓':'Not yet'} · Application reference: ${esc(m.membershipNumber||m.id||'Pending')}</p>${applicationTimeline(status)}${canResume?`<div class="panelx"><b>${status==='PAYMENT_FAILED'?'Payment needs attention':'You can continue from where you stopped.'}</b><p class="mutedx">Your email being used does not make you an approved member. Your application stays pending until payment, review and certificate issuance are complete.</p><button class="btn primary" onclick="resumeApplication()">${status==='PAYMENT_FAILED'?'TRY PAYMENT AGAIN':'CONTINUE WHERE I LEFT OFF'}</button></div>`:''}${status==='PENDING_REVIEW'?'<div class="panelx"><b>Payment received ✓</b><p class="mutedx">GLDC is reviewing your application. Membership access will be activated after approval and certificate issuance.</p></div>':''}</div>`;
$('portal').innerHTML=hero+`<div class="stat-grid" style="margin-top:18px"><div class="stat"><small>STATUS</small><div class="value">${badge(status)}</div><div class="small">${approved?'Approved membership':'Application in progress'}</div></div><div class="stat"><small>PLAN</small><div class="value">${esc(m.membershipPlan||'Not selected')}</div><div class="small">${approved?'Current membership tier':'Choose a plan to continue'}</div></div><div class="stat"><small>VALID UNTIL</small><div class="value">${approved?esc(date(m.validUntil)):'—'}</div><div class="small">${approved?'Membership period':'Issued after approval'}</div></div><div class="stat"><small>PAYMENTS</small><div class="value">${payments.length}</div><div class="small">Membership payment records</div></div></div>
${canChange?`<div class="member-card" style="margin-top:18px"><div class="directory-cta"><div><span class="eyebrow">PLAN MANAGEMENT</span><h2>Change or upgrade your membership</h2><p class="mutedx">You may review another tier before paying. Nothing replaces your current approved membership until the new payment and GLDC review are complete.</p></div><button class="btn primary" onclick="showPlanEditor()">EDIT / UPGRADE TIER</button></div><div id="planEditor"></div></div>`:''}
<div class="member-grid"><div class="member-card"><span class="eyebrow">PROFILE</span><h2>Your details</h2><div class="profile-grid"><div class="profile-row"><label>Full name</label><strong>${esc(m.name||'—')}</strong></div><div class="profile-row"><label>Email</label><strong>${esc(m.email||'—')}</strong></div><div class="profile-row"><label>Phone</label><strong>${esc(m.phone||'—')}</strong></div><div class="profile-row"><label>Profession</label><strong>${esc(m.profession||'—')}</strong></div><div class="profile-row"><label>Company</label><strong>${esc(m.company||'—')}</strong></div><div class="profile-row"><label>Location</label><strong>${esc(m.location||'—')}</strong></div></div><div class="member-actions" style="margin-top:15px"><button class="btn secondary" onclick="toggleEdit()">EDIT PROFILE</button></div><div id="editPanel" class="edit-panel hidden"><form id="profileForm"><div class="profile-grid"><div class="field"><label>Full name *</label><input name="name" required value="${esc(m.name)}"></div><div class="field"><label>Phone *</label><input name="phone" type="tel" inputmode="tel" placeholder="0712 345 678 or +254 712 345 678" pattern="(?:0|\\+254)7\\d{8}" required value="${esc(m.phone)}"></div><div class="field"><label>Profession</label><input name="profession" value="${esc(m.profession)}"></div><div class="field"><label>Company</label><input name="company" value="${esc(m.company)}"></div><div class="field"><label>Location / town</label><input name="location" value="${esc(m.location)}"></div><div class="field"><label>Portfolio URL</label><input name="portfolioUrl" type="url" value="${esc(m.portfolioUrl)}"></div></div><div class="field"><label>Biography</label><textarea name="bio">${esc(m.bio)}</textarea></div><div class="member-actions"><button class="btn primary">SAVE CHANGES</button><button type="button" class="btn" onclick="toggleEdit()">CANCEL</button></div></form><div id="profileMsg"></div></div></div>
<div class="member-card"><span class="eyebrow">MEMBER DIRECTORY</span><h2>Meet other approved members</h2><p class="mutedx">Browse the public directory of approved GLDC members. Pending applications are never shown here.</p><a class="btn primary" href="/members">SEE OTHER MEMBERS</a><div id="memberMap" style="height:250px;border-radius:12px;margin-top:18px"></div></div></div>
<div class="member-grid"><div class="member-card"><span class="eyebrow">CERTIFICATES</span><h2>Certificate history</h2>${certs.length?certs.map(c=>`<div class="record"><b>${esc(c.certificateNumber)}</b> ${badge(c.status||'ACTIVE')}<br><small>${esc(c.planName)} · ${esc(date(c.validFrom))} – ${esc(date(c.validUntil))}</small><div class="record-actions"><a class="btn small secondary" href="/api/member/certificates/${encodeURIComponent(c.certificateNumber)}/download">DOWNLOAD</a> <a class="btn small" href="/membership/certificate/${encodeURIComponent(c.certificateNumber)}" target="_blank">VERIFY</a></div></div>`).join(''):'<p class="mutedx">No certificate has been issued. A certificate becomes available only after payment and GLDC approval.</p>'}</div><div class="member-card"><span class="eyebrow">PAYMENTS</span><h2>Payment history</h2>${payments.length?payments.map(p=>`<div class="record"><b>${esc(p.planName||'Membership')}</b> · KES ${Number(p.amount||0).toLocaleString()}<br>${badge(p.status)}<br><small>Receipt: ${esc(p.receiptCode||'Pending')} · ${esc(date(p.createdAt))}</small></div>`).join(''):'<p class="mutedx">No membership payments yet.</p>'}</div></div>
<div class="member-grid"><div class="member-card"><span class="eyebrow">MY LEADS</span><h2>Leads I created</h2>${leads.length?leads.map(l=>`<div class="record"><b>${esc(l.name)}</b> · ${esc(l.status)}<br><small>${esc(l.service||'')} · ${esc(l.town||'')}</small></div>`).join(''):'<p class="mutedx">No leads created yet.</p>'}<a class="btn secondary" href="/quote">CREATE / MANAGE LEADS</a></div><div class="member-card"><span class="eyebrow">DOCUMENTS & NOTIFICATIONS</span><h2>My records</h2>${docs.map(d=>`<div class="record"><b>${esc(d.category)}</b> — ${esc(d.name)}</div>`).join('')||'<p class="mutedx">No supporting documents uploaded.</p>'}<hr><h3>Notifications</h3>${notes.map(n=>`<div class="record"><b>${esc(n.type||'Update')}</b><br>${esc(n.message)}</div>`).join('')||'<p class="mutedx">No new notifications.</p>'}</div></div>
<div class="member-card" style="margin-top:18px"><span class="eyebrow">SECURITY</span><h2>Member sign-in</h2><p class="mutedx">Use email verification to securely access your application or approved membership.</p><a class="btn secondary" href="/member/login">MEMBER LOGIN</a></div>`;
const pf=$('profileForm');if(pf)pf.onsubmit=saveProfile;drawMap(m);if(new URLSearchParams(location.search).get('edit')==='1')toggleEdit(true)}
function toggleEdit(force){const p=$('editPanel');if(p)p.classList.toggle('hidden',force===true?false:undefined)}
function showPlanEditor(){const el=$('planEditor');if(!el)return;const ps=state.plans||[];el.innerHTML=`<div class="panelx"><label><b>Select a membership tier</b></label><div class="plan-options">${ps.map(p=>`<label class="plan-option ${p.id===state.member.membershipPlanId?'selected':''}"><input type="radio" name="changePlan" value="${esc(p.id)}" ${p.id===state.member.membershipPlanId?'checked':''}> <b>${esc(p.name)}</b><br><small>KES ${Number(p.price||0).toLocaleString()} · ${esc(p.months)} months</small></label>`).join('')}</div><button class="btn primary" style="margin-top:12px" onclick="changePlan()">PROCEED TO PAYMENT</button><div id="planMsg"></div></div>`}
async function changePlan(){const p=document.querySelector('input[name=changePlan]:checked')?.value;if(!p){$('planMsg').innerHTML='<div class="notice">Please select a membership tier.</div>';return}if(!confirm('Proceed with this tier? Your current approved membership will remain unchanged until the new payment and GLDC approval are complete.'))return;try{const r=await fetch('/api/membership/change-plan',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({planId:p})});const j=await json(r);if(!r.ok)throw Error(j.error?.message||'We could not start the plan-change payment.');$('planMsg').innerHTML='<div class="notice">'+esc(j.message||'Payment prompt sent. Approve it on your phone.')+'</div>';setTimeout(load,5000)}catch(e){$('planMsg').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
async function resumeApplication(){try{const email=state.member?.email||'';const memberId=state.member?.id||state.member?.memberId||'';const token=localStorage.getItem('gldc_resume_token')||'';if(email&&memberId&&token){const r=await fetch('/api/membership/resume',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({email,memberId,resumeToken:token})});const j=await json(r);if(!r.ok)throw Error(j.error?.message||'Unable to resume.')}location.href='/member'}catch(e){const x=$('resumeMsg');if(x)x.innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
function drawMap(m){if(!window.L)return;const el=$('memberMap');if(!el)return;const lat=Number(m.locationLat),lng=Number(m.locationLng);const has=Number.isFinite(lat)&&Number.isFinite(lng);const map=L.map(el).setView(has?[lat,lng]:[-1.286389,36.817223],has?13:6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);if(has)L.marker([lat,lng]).addTo(map).bindPopup('<b>My saved location</b>').openPopup();setTimeout(()=>map.invalidateSize(),150)}
async function saveProfile(e){e.preventDefault();const data=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('/api/membership/profile',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(data)});const j=await json(r);$('profileMsg').innerHTML='<div class="notice">'+esc(j.ok?'Profile saved successfully.':j.error?.message||'Unable to save profile.')+'</div>';if(j.ok)setTimeout(load,700)}
async function logout(){await fetch('/api/auth/logout',{method:'POST',headers:{'X-CSRF-Token':csrf}});location.href='/member/login'}
load();
</script>{% endblock %}
