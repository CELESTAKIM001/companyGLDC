{% extends 'base.html' %}{% block content %}<main class="page"><section class="hero"><span class="eyebrow">START WITH A CONSULTATION</span><h1>Tell GLDC about your project.</h1><p>Share the essentials and the team can follow up with the appropriate next step.</p></section><section class="section"><div class="panel" style="max-width:800px;margin:auto"><form id="consultForm" class="form-grid"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Service</label><input name="service" placeholder="Land / Planning / Design / Development"></div><div class="field"><label>Preferred date</label><input name="preferredDate" type="date"></div><div class="field full"><label>Project details</label><textarea name="message" rows="6"></textarea></div><div class="field full"><button class="btn primary">REQUEST CONSULTATION</button></div></form><div id="consultMsg"></div></div></section></main><script>document.getElementById('consultForm').addEventListener('submit',async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('/api/consultations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();document.getElementById('consultMsg').innerHTML='<div class="notice">'+(j.message||j.error?.message||'Request submitted.')+'</div>';if(r.ok)e.currentTarget.reset()})</script>{% endblock %}
