{% extends 'base.html' %}
{% block content %}
<div class="renew-page">
  <div class="renew-wrap">
    <div class="renew-head">
      <div><span class="renew-kicker">GLDC / MEMBERSHIP RENEWAL</span><h1>Renew your membership</h1><p>Keep your GLDC membership active without starting a new registration.</p></div>
      <a href="/member/dashboard" class="renew-back">← BACK TO DASHBOARD</a>
    </div>
    <div id="renewApp"><div class="renew-loading">Loading your membership…</div></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<style>
.renew-page{min-height:calc(100vh - 82px);background:#f6f3ef;padding:48px 20px 80px;color:#211d19}.renew-wrap{max-width:1050px;margin:auto}.renew-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:25px}.renew-kicker{font-size:10px;letter-spacing:.16em;font-weight:900;color:#8b4a18}.renew-head h1{font-size:38px;letter-spacing:-.04em;margin:7px 0}.renew-head p{color:#756d65;margin:0}.renew-back{padding:11px 15px;border:1px solid #dfd4c8;border-radius:10px;background:#fff;color:#8b4a18;font-size:11px;font-weight:900}.renew-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.renew-card{background:#fff;border:1px solid #e8ded4;border-radius:18px;padding:24px;box-shadow:0 8px 28px #3b261308}.renew-card h2{font-size:19px;margin:0 0 6px}.renew-card p{color:#756d65;font-size:12px}.renew-status{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.renew-stat{padding:16px;border:1px solid #eee5dc;border-radius:12px;background:#fbf8f4}.renew-stat small{display:block;color:#8d847c;font-size:9px;font-weight:900;letter-spacing:.08em}.renew-stat b{display:block;margin-top:7px;font-size:16px}.renew-stat b.days{font-size:28px;color:#8b4a18}.renew-plans{display:grid;gap:11px;margin-top:18px}.renew-plan{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px;border:1px solid #e6ddd4;border-radius:13px;cursor:pointer}.renew-plan.selected{border:2px solid #8b4a18;background:#fff9f2}.renew-plan input{accent-color:#8b4a18}.renew-plan strong{font-size:14px}.renew-plan small{display:block;color:#827970;margin-top:3px}.renew-price{font-weight:900;color:#8b4a18;white-space:nowrap}.renew-btn{width:100%;margin-top:18px;border:0;border-radius:11px;background:#8b4a18;color:#fff;padding:14px;font-weight:900;cursor:pointer}.renew-btn:disabled{opacity:.55;cursor:not-allowed}.renew-notice{padding:15px;border-radius:12px;background:#fff8e9;border:1px solid #f0d49b;font-size:12px;margin-top:15px}.renew-success{padding:18px;border-radius:13px;background:#eaf7ef;border:1px solid #b9e2c8;color:#185f38}.renew-failed{padding:18px;border-radius:13px;background:#fdecea;border:1px solid #efc2bd;color:#8d3028}.renew-certificate{background:linear-gradient(145deg,#fffaf2,#f5e9db);border:1px solid #ead2b5;text-align:center}.renew-cert-seal{width:62px;height:62px;border-radius:50%;border:2px solid #f0b51d;display:grid;place-items:center;margin:0 auto 12px;color:#8b4a18;font-weight:900}.renew-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.renew-link{display:inline-flex;padding:10px 13px;border-radius:9px;border:1px solid #dfd4c8;background:#fff;color:#8b4a18;font-size:11px;font-weight:900}.renew-poll{display:none}.renew-poll.show{display:block}.renew-count{font-weight:900;color:#8b4a18}@media(max-width:800px){.renew-grid{grid-template-columns:1fr}.renew-head{display:block}.renew-back{display:inline-block;margin-top:15px}.renew-head h1{font-size:31px}}@media(max-width:520px){.renew-status{grid-template-columns:1fr}.renew-page{padding:28px 14px 60px}.renew-card{padding:18px}}
</style>
<script>
const csrf=document.querySelector('meta[name=csrf-token]')?.content||'';let portal=null,pollTimer=null;const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
async function json(r){const t=await r.text();try{return JSON.parse(t)}catch(_){return {ok:false,error:{message:t||'Request failed'}}}}
function daysRemaining(v){if(!v)return null;const d=new Date(String(v).slice(0,10)+'T00:00:00');const n=new Date();n.setHours(0,0,0,0);return Math.ceil((d-n)/86400000)}
function money(v){return 'KES '+Number(v||0).toLocaleString()}
function render(){const m=portal.member||{},s=String(m.status||'').toUpperCase(),days=daysRemaining(m.validUntil),cert=(portal.certificates||[])[0],plans=portal.plans||[];const renewalAllowed=!!m.renewalAvailable;
 $('renewApp').innerHTML=`<div class="renew-grid"><section class="renew-card"><h2>Membership status</h2><p>Your current membership period and renewal eligibility.</p><div class="renew-status"><div class="renew-stat"><small>CURRENT PLAN</small><b>${esc(m.membershipPlan||'—')}</b></div><div class="renew-stat"><small>VALID UNTIL</small><b>${esc(String(m.validUntil||'').slice(0,10)||'—')}</b></div><div class="renew-stat"><small>TIME REMAINING</small><b class="days">${days===null?'—':days>0?days+' days':days===0?'Expires today':'Expired'}</b></div></div>${days!==null&&days>0?`<div class="renew-notice"><b>Renewal window</b><p style="margin:5px 0 0">You can renew during the configured ${esc(m.renewalWindowDays||30)}-day renewal window. Your existing membership remains active until its current expiry date.</p></div>`:''}${!renewalAllowed?`<div class="renew-notice"><b>Renewal is not currently available.</b><p style="margin:5px 0 0">Your account must be inside the renewal window or already expired, and there must not be another renewal awaiting review.</p><a class="renew-link" href="/member/dashboard">RETURN TO DASHBOARD</a></div>`:''}<h2 style="margin-top:25px">Choose your renewal plan</h2><p>Select the tier you want for the next membership period.</p><div class="renew-plans">${plans.map((p,i)=>`<label class="renew-plan ${i===0?'selected':''}" onclick="selectPlan(this)"><div><input type="radio" name="plan" value="${esc(p.id)}" ${i===0?'checked':''}> <strong>${esc(p.name)}</strong><small>${esc(p.months)} month${Number(p.months)==1?'':'s'} · ${p.price<=0?'Free tier':'Membership renewal'}</small></div><span class="renew-price">${p.price<=0?'FREE':money(p.price)}</span></label>`).join('')}</div><button id="renewBtn" class="renew-btn" ${renewalAllowed?'':'disabled'} onclick="startRenewal()">${renewalAllowed?'SEND M-PESA PAYMENT PROMPT':'RENEWAL NOT OPEN'}</button><div id="result"></div><div id="poll" class="renew-poll"><div class="renew-notice"><b>Waiting for M-Pesa confirmation…</b><p>Approve the prompt on your phone. This page will update automatically.</p><span class="renew-count">Checking payment status…</span></div></div></section><aside class="renew-card renew-certificate"><div class="renew-cert-seal">GLDC</div><span class="renew-kicker">OFFICIAL MEMBERSHIP RECORD</span><h2 style="margin-top:7px">Your certificate</h2>${cert?`<p><b>${esc(cert.certificateNumber)}</b></p><p>${esc(String(cert.validFrom||'').slice(0,10))} — ${esc(String(cert.validUntil||'').slice(0,10))}</p><div class="renew-actions" style="justify-content:center"><a class="renew-link" href="/api/member/certificates/${encodeURIComponent(cert.certificateNumber)}/download">DOWNLOAD PDF</a><a class="renew-link" target="_blank" href="/membership/certificate/${encodeURIComponent(cert.certificateNumber)}">VERIFY QR RECORD</a><button class="renew-link" onclick="emailCert('${esc(cert.certificateNumber)}',this)">EMAIL CERTIFICATE</button></div>`:'<p>Your official certificate will appear here after membership approval.</p>'}<div class="renew-notice" style="text-align:left;margin-top:25px"><b>What happens after payment?</b><p style="margin:6px 0 0">1. Approve the M-Pesa prompt.<br>2. GLDC receives the payment result.<br>3. Your renewal moves to review.<br>4. After approval, a new certificate is issued with the new validity period.<br>5. Your QR verification record remains available.</p></div></aside></div>`}
function selectPlan(el){document.querySelectorAll('.renew-plan').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
async function startRenewal(){const plan=document.querySelector('input[name=plan]:checked')?.value;if(!plan)return;const b=$('renewBtn');b.disabled=true;b.textContent='SENDING PROMPT…';$('result').innerHTML='';try{const r=await fetch('/api/membership/subscribe',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({planId:plan})});const j=await json(r);if(!r.ok||!j.ok)throw Error(j.error?.message||j.message||'Unable to start renewal.');if(j.free){showSuccess('Renewal request submitted for GLDC review. This tier requires no M-Pesa payment.');return}showSuccess('M-Pesa prompt sent. Approve the payment on your phone.');$('poll').classList.add('show');pollPayment(j.paymentId)}catch(e){$('result').innerHTML=`<div class="renew-failed">${esc(e.message)}<br><button class="renew-link" style="margin-top:10px" onclick="startRenewal()">TRY AGAIN</button></div>`;b.disabled=false;b.textContent='SEND M-PESA PAYMENT PROMPT'}}
function showSuccess(msg){$('result').innerHTML=`<div class="renew-success"><b>Renewal payment started ✓</b><div style="margin-top:5px">${esc(msg)}</div></div>`}
async function pollPayment(id){let n=0;clearInterval(pollTimer);pollTimer=setInterval(async()=>{n++;try{const r=await fetch('/api/payments/'+encodeURIComponent(id)+'/status');const j=await json(r);if(!r.ok||!j.ok)throw Error(j.error?.message||'Status unavailable');const p=j.payment||{};$('poll').querySelector('.renew-count').textContent=p.message||'Checking payment status…';if(['SUCCESSFUL','CANCELLED','FAILED','PENDING_ADMIN_VERIFICATION'].includes(String(p.status).toUpperCase())){clearInterval(pollTimer);$('poll').classList.remove('show');if(p.status==='SUCCESSFUL'){showSuccess('Payment successful. Your renewal is now awaiting GLDC review.');$('renewBtn').textContent='PAYMENT RECEIVED ✓';}else if(p.status==='CANCELLED'){$('result').innerHTML='<div class="renew-failed"><b>User cancelled the transaction.</b><br>You can safely try the renewal payment again.</div>';$('renewBtn').disabled=false;$('renewBtn').textContent='TRY PAYMENT AGAIN'}else if(p.status==='FAILED'){$('result').innerHTML='<div class="renew-failed"><b>Payment failed.</b><br>Please recheck the details and try again.</div>';$('renewBtn').disabled=false;$('renewBtn').textContent='RECHECK & TRY AGAIN'}else{$('result').innerHTML='<div class="renew-notice"><b>Payment received — verification pending.</b><br>GLDC will review the payment before activating the renewal.</div>';$('renewBtn').disabled=true;$('renewBtn').textContent='AWAITING GLDC VERIFICATION'}}}catch(e){}if(n>=40)clearInterval(pollTimer)},3000)}
async function emailCert(no,btn){btn.disabled=true;btn.textContent='SENDING…';try{const r=await fetch('/api/member/certificates/'+encodeURIComponent(no)+'/send-email',{method:'POST',headers:{'X-CSRF-Token':csrf}});const j=await json(r);if(!r.ok||!j.ok)throw Error(j.error?.message||'Certificate email failed');btn.textContent='EMAILED ✓'}catch(e){alert(e.message);btn.disabled=false;btn.textContent='EMAIL CERTIFICATE'}}
async function load(){try{const r=await fetch('/api/member/portal');portal=await json(r);if(!r.ok||!portal.ok)throw Error(portal.error?.message||'Unable to load membership.');render()}catch(e){$('renewApp').innerHTML=`<div class="renew-card"><h2>Renewal unavailable</h2><p>${esc(e.message)}</p><a class="renew-link" href="/member/dashboard">RETURN TO DASHBOARD</a></div>`}}
load();
</script>
{% endblock %}
