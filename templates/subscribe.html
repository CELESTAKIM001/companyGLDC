{% extends 'base.html' %}{% block content %}<main class="page"><section class="page-hero"><div class="container"><span class="eyebrow">GLDC</span><h1>Stay connected with GLDC.</h1><p>Receive practical updates on land, development, planning and project delivery.</p></div></section><section class="section"><div class="container" style="max-width:680px"><div class="card"><form id="subscribeForm"><div class="field"><label>Name</label><input id="subName"></div><div class="field"><label>Email *</label><input id="subEmail" type="email" required></div><button class="btn primary" type="submit">SUBSCRIBE</button></form><div id="subMsg"></div></div></div></section></main>{% endblock %}{% block scripts %}<script>document.getElementById('subscribeForm').addEventListener('submit',async e=>{e.preventDefault();try{const r=await fetch('/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:subName.value,email:subEmail.value})});const j=await r.json();if(!r.ok)throw Error(j.error?.message||'Unable to subscribe');subMsg.innerHTML='<div class="notice">✓ '+j.message+'</div>';e.target.reset()}catch(x){subMsg.innerHTML='<div class="notice">'+x.message+'</div>'}})</script>{% endblock %}
