{% extends 'base.html' %}{% block content %}<main class="page"><section class="page-hero"><div class="container"><span class="eyebrow">GLDC</span><h1>Send us a message.</h1><p>Tell the GLDC team what you are planning and we will guide the next step.</p></div></section><section class="section"><div class="container" style="max-width:780px"><div class="card"><form id="messageForm"><div class="formx"><div class="field"><label>Name *</label><input id="msgName" required></div><div class="field"><label>Email *</label><input id="msgEmail" type="email" required></div><div class="field"><label>Phone</label><input id="msgPhone"></div><div class="field"><label>Subject</label><input id="msgSubject"></div><div class="field full"><label>Message *</label><textarea id="msgText" rows="7" required></textarea></div></div><button class="btn primary" type="submit">SEND MESSAGE</button></form><div id="msgResult"></div></div></div></section></main>{% endblock %}{% block scripts %}<script>document.getElementById('messageForm').addEventListener('submit',async e=>{e.preventDefault();try{const r=await fetch('/api/message-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:msgName.value,email:msgEmail.value,phone:msgPhone.value,subject:msgSubject.value,message:msgText.value})});const j=await r.json();if(!r.ok)throw Error(j.error?.message||'Unable to send');msgResult.innerHTML='<div class="notice">✓ '+j.message+'</div>';e.target.reset()}catch(x){msgResult.innerHTML='<div class="notice">'+x.message+'</div>'}})</script>{% endblock %}
