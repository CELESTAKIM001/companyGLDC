{% extends 'base.html' %}{% block content %}<main class='login-screen'><div class='login-box'><img src="{{ url_for('static',filename='assets/gldc-logo.png') }}" alt='GLDC'><span class='eyebrow'>FIRST ADMINISTRATOR SETUP</span><h2>Initialize GLDC Administration</h2><p>This page is available only while no super administrator exists. Once completed, this setup URL is disabled.</p><form id='setup'><div class='field'><label>Full name</label><input name='name' required></div><div class='field'><label>Email</label><input name='email' type='email' required></div><div class='field'><label>Phone</label><input name='phone'></div><div class='field'><label>Strong password</label><input name='password' type='password' minlength='12' required></div><button class='btn primary' style='width:100%'>INITIALIZE ADMIN</button></form><div id='msg'></div></div></main>{% endblock %}{% block scripts %}<script>setup.addEventListener('submit',async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(setup));const r=await fetch('/api/admin/setup',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':document.querySelector('meta[name=csrf-token]').content},body:JSON.stringify(b)});const j=await r.json();if(j.ok){msg.innerHTML='<div class=notice>Administration initialized. Redirecting…</div>';setTimeout(()=>location.href='/admin',800)}else msg.innerHTML='<div class=notice>'+ (j.error?.message||'Setup failed.')+'</div>'})</script>{% endblock %}
